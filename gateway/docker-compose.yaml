services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5

  gateway-api:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8686 --reload
    ports: ['8686:8686']
    env_file: .env
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ['.:/app']
    working_dir: /app

  step-worker:
    build: .
    command: celery -A pyworkflow.celery.app worker --loglevel=info --queues=pyworkflow.steps --autoscale=10,2
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres_data:
