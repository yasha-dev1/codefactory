[tool.poetry]
name = "codefactory-worker-agent"
version = "0.1.0"
description = "Worker agent for CodeFactory Gateway"
packages = [{include = "worker_agent"}]

[tool.poetry.dependencies]
python = ">=3.11"
pyworkflow-engine = ">=0.2.3"
httpx = ">=0.27.0"
pydantic-settings = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"

[tool.poetry.scripts]
codefactory-worker = "worker_agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
