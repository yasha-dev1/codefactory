[tool.poetry]
name = "codefactory-gateway"
version = "0.1.0"
description = "CodeFactory Gateway — webhook-driven workflow orchestration for AI coding agents"
authors = []
readme = "README.md"
packages = [{include = "gateway"}]

[tool.poetry.dependencies]
python = ">=3.11"
pyworkflow-engine = ">=0.2.3"
fastapi = ">=0.109.0"
uvicorn = ">=0.27.0"
pydantic-settings = ">=2.0.0"
sqlalchemy = {version = ">=2.0.0", extras = ["asyncio"]}
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
