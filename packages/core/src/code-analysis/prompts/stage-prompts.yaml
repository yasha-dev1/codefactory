id: stage-prompts
version: 1
description: >
  Generate tailored prompts for every pipeline stage the wizard will
  configure. The agent emits a single JSON map keyed by stage id so
  prompts stay consistent in tone and can reference each other.
variables:
  - outputPath
  - techStackJson
  - stageLines
  - sessionDir
  - cwd
prompt: |
  You are generating **stage prompts** for harnext — the pipeline that
  processes GitHub issues on this repo. Each stage is a single run of
  the coding agent; the prompts you write are what the agent sees when
  that stage fires.

  Tailor each prompt to this codebase using the TechStack below.
  Reference the exact `testCommand` / `lintCommand` / `buildCommand` /
  `typecheckCommand` when relevant. Mention the monorepo package paths
  when appropriate. Keep prompts tight — aim for 8–20 lines each, no
  filler. Write in the imperative ("Read the issue body…"), not the
  descriptive.

  Stage-by-stage guidance:
    - triage    : no code changes. Post one GitHub comment classifying
                  the issue (severity, scope, ready-to-plan).
    - plan      : no code changes. Post one GitHub comment with an
                  implementation plan (summary, files to change,
                  approach, risks, test plan).
    - implement : create a branch `issue/<num>-<slug>`, make the
                  changes, open a DRAFT PR that closes the issue. Do
                  not merge.
    - verify    : check out the PR branch, run tests / lint /
                  typecheck, post one PR comment with exit codes.
                  Commit mechanical fixes only.
                  **UI verification is MANDATORY** when any
                  TechStack package has `hasUI: true` AND the PR
                  diff (`gh pr diff --name-only`) touches a file
                  under one of those packages' paths. The verify
                  prompt MUST state this as a hard requirement
                  with NO escape hatch. Specifically:
                    1. The prompt MUST name the bundled
                       `browser-verify` skill as the sole
                       mechanism — not "preferred" with a
                       fallback. The skill is pre-installed.
                    2. The prompt MUST forbid these excuses
                       verbatim: "requires authenticated
                       workspace", "skipped: tool missing",
                       "change is too small/trivial to test",
                       "no reproduction available". The skill
                       runs headful against the user's real
                       Chrome profile (auto-cloned) — no auth
                       setup is needed.
                    3. The prompt MUST demand that even a pure
                       CSS / Tailwind / copy tweak produces a
                       minimal scenario: navigate to a page
                       containing the changed component, take
                       one a11y snapshot, assert the component
                       exists. Skipping is never acceptable on
                       a UI-touching PR.
                    4. The prompt MUST tell the agent to cite
                       the three artifact paths produced by the
                       skill in the final PR comment:
                         `.harnext/browser-verify/<runId>/video/recording.webm`
                         `.harnext/browser-verify/<runId>/network.har`
                         `.harnext/browser-verify/<runId>/trace.zip`
                       (paths come from the skill's JSON
                       output — cite verbatim, don't invent).
                    5. The prompt MUST FAIL the stage on any of:
                       non-zero exit from the skill, a new
                       `pageErrors` entry (vs. main), or a
                       failing scenario assertion.
                  For PRs that do NOT touch a UI path, skip
                  browser work — tests/lint/typecheck are enough.
                  The `chrome-devtools` MCP fallback is retired:
                  do not mention it. `browser-verify` handles
                  all cases it previously covered.
    - review    : `review` = post one PR review (approve / request
                  changes / comment).
                  `fix`    = address a changes_requested review by
                  editing the branch.

  TechStack:

  {{techStackJson}}

  Write a single JSON file at **exactly** this path:

    {{outputPath}}

  Shape:

  {
  {{stageLines}}
  }

  Include only the stage ids listed above. No extra keys. No markdown.
  No comments. After writing the file, reply with one short sentence
  confirming the path.

  Session scratch dir (intermediate notes if needed): {{sessionDir}}
  Repository root (cwd): {{cwd}}
